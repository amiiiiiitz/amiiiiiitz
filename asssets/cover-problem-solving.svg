<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-opacity=".07"/></pattern>
<radialGradient id="hue"><stop offset="0" stop-color="#67E8F9" stop-opacity=".5"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient><clipPath id="c"><rect width="640" height="320" rx="18"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="640" height="320" fill="url(#bg)"/><rect width="640" height="320" fill="url(#grid)"/>
<circle cx="150" cy="260" r="200" fill="url(#hue)"/><text x="28" y="50" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#67E8F9" opacity=".13">for (int i = 0; i &lt; n; i++) {</text><text x="28" y="72" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#67E8F9" opacity=".13">  if (dp[i] &gt; best) best = dp[i];</text><text x="28" y="94" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#67E8F9" opacity=".13">}</text><text x="28" y="116" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#67E8F9" opacity=".13">while (lo &lt; hi) { mid = (lo + hi) / 2; }</text><text x="28" y="138" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#67E8F9" opacity=".13">return solve(graph, start);</text>
<text x="40" y="300" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="90" font-weight="700" fill="#A78BFA" opacity=".08">{ }</text>
