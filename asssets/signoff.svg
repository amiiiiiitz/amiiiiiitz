<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Animated closing panel: always building the next thing. Learn continuously, build thoughtfully, improve consistently." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset=".6" stop-color="#150F26"/><stop offset="1" stop-color="#0D1D24"/></linearGradient>
<linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D1436"/><stop offset="1" stop-color="#101A24"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#67E8F9" stop-opacity=".9"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="vglow"><stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<radialGradient id="cglow"><stop offset="0" stop-color="#67E8F9" stop-opacity=".4"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-opacity=".07"/></pattern>
<clipPath id="c"><rect width="1200" height="230" rx="22"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1200" height="230" fill="url(#bg)"/><rect width="1200" height="230" fill="url(#grid)"/>

<circle cx="240" cy="70" r="220" fill="url(#vglow)"><animate attributeName="cx" values="240;420;240" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="150" r="220" fill="url(#cglow)"><animate attributeName="cx" values="980;800;980" dur="14s" repeatCount="indefinite"/></circle>
<text x="600" y="78" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#F5F3FF">ALWAYS BUILDING THE NEXT THING</text>
<text x="600" y="112" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="2" fill="#67E8F9">Learn continuously.  Build thoughtfully.  Improve consistently.</text>
<path d="M0 150 Q150 134 300 150 T600 150 T1200 150 T1800 150 T2400 150 T3000 150 V230 H0 Z" fill="#A78BFA" fill-opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="13s" repeatCount="indefinite"/></path><path d="M0 166 Q150 152 300 166 T600 166 T1200 166 T1800 166 T2400 166 T3000 166 V230 H0 Z" fill="#211638" fill-opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="9s" repeatCount="indefinite"/></path><path d="M0 184 Q150 172 300 184 T600 184 T1200 184 T1800 184 T2400 184 T3000 184 V230 H0 Z" fill="#0D1117" fill-opacity="0.95"><animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="7s" repeatCount="indefinite"/></path>

</g>
<rect x="1" y="1" width="1198" height="228" rx="22" fill="none" stroke="url(#bd)" stroke-opacity=".55" stroke-width="1.5"/>

</svg>